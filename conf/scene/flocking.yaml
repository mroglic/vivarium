defaults:
  - base_scene
  - environment/components/base_physics@environment.components.component_list
  - environment/components/entities/braitenberg@environment.components.component_list.agents
  - clients/braitenberg@environment.components.component_list.agents.client
  - _self_

scene_name: flocking

environment:
  kwargs:
    box_size: 100.0
    neighbor_radius: 20.0
    dr_threshold: 1.0
    num_scan_steps: 1
  components:
    component_list:
      step:
        dt: 0.2
      agents:
        n_max: 12
        n_behaviors: 1
        client:
          controller_kwargs:
            visible_wheels:
              _all_values_: false
            visible_proxs:
              _all_values_: false
        by_indices:
          - boid:
              indices: "${range: 0, 12}"
              subtype: boid
              diameter: 2.0
              wheel_diameter: 6.0
              proxs_cos_min: 0.9
              proxs_dist_max: 15.0
              client:
                color: "#4488ff"
                behaviors:
                  - LOVE: [boid]

simulator:
  client:
    controller_kwargs:
      freq: -1.0

subtype_labels:
  - boid

interface:
  notebook:
    path: notebooks/sessions/flocking_boids.ipynb
